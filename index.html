<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f2"><link rel="manifest" href="manifest.webmanifest"><title>70kg 減脂日誌</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1c1c1e;background:#f5f5f2}*{box-sizing:border-box}body{margin:0;padding:18px 14px 48px}.wrap{max-width:720px;margin:auto}h1{font-size:24px;margin:4px 0 14px}.cards,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card,.panel{background:#fff;border-radius:16px;padding:14px;border:1px solid #e5e5e5}.muted{color:#6e6e73;font-size:13px}.big{font-size:25px;font-weight:700}.panel{margin-top:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input,select,button{font:inherit;min-height:46px;border-radius:12px;border:1px solid #d5d5d5;padding:10px;background:#fff}input,select{width:100%}button{cursor:pointer}.primary{background:#1c1c1e;color:#fff;border-color:#1c1c1e}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.food{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #eee;padding:10px 0}.bar{height:10px;background:#ececec;border-radius:99px;overflow:hidden;margin-top:10px}.bar>div{height:100%;background:#1c1c1e;width:0}.smallbtn{min-height:38px;padding:6px 10px}.progress{font-size:13px;margin-top:8px;color:#6e6e73}@media(max-width:430px){.cards{grid-template-columns:1fr 1fr}.cards .card:last-child{grid-column:1/-1}.grid{grid-template-columns:1fr 1fr}}</style></head>
<body><main class="wrap"><h1>70 kg 減脂日誌</h1>
<section class="cards"><div class="card"><div class="muted">目前體重</div><div class="big" id="currentWeight">77.0 kg</div></div><div class="card"><div class="muted">目標體重</div><div class="big">70.0 kg</div></div><div class="card"><div class="muted">每日目標</div><div class="big">2000 kcal</div></div></section><section class="cards" style="margin-top:8px"><div class="card"><div class="muted">基礎代謝 BMR</div><div class="big">1713 kcal</div></div><div class="card"><div class="muted">減脂攝取目標</div><div class="big">2000 kcal</div></div><div class="card"><div class="muted">預估每日總消耗 TDEE</div><div class="big">2400～2600</div><div class="muted">kcal／天（估算）</div></div></section>
<section class="panel"><div class="two"><label>日期<input id="date" type="date"></label><label>餐別<select id="meal"><option>早餐</option><option>午餐</option><option>下午點心</option><option>晚餐</option><option>運動前</option><option>運動後</option></select></label></div><div class="grid" style="margin-top:10px"><div><div class="muted">已吃</div><div class="big"><span id="used">0</span></div><div class="muted">kcal</div></div><div><div class="muted">剩餘</div><div class="big"><span id="remain">2000</span></div><div class="muted">kcal</div></div><div><div class="muted">蛋白質</div><div class="big"><span id="protein">0</span></div><div class="muted">/ 110 g</div></div></div><div class="bar"><div id="bar"></div></div></section>
<form class="panel" id="foodForm"><strong>新增飲食</strong><div style="margin-top:10px"><input id="food" required placeholder="食物，例如：雞腿便當"></div><div class="two" style="margin-top:8px"><input id="cal" type="number" min="0" required placeholder="熱量 kcal"><input id="pro" type="number" min="0" placeholder="蛋白質 g"></div><button class="primary" style="width:100%;margin-top:8px" type="submit">＋ 加入這一天</button></form>
<section class="panel"><strong>常用食物</strong><div class="quick" id="quick" style="margin-top:10px"><button data-n="水煮蛋 2 顆" data-c="140" data-p="12">🥚 水煮蛋 ×2<br><span class="muted">140 kcal</span></button><button data-n="無糖豆漿" data-c="120" data-p="10">🥛 無糖豆漿<br><span class="muted">120 kcal</span></button><button data-n="香蕉 1 根" data-c="100" data-p="1">🍌 香蕉<br><span class="muted">100 kcal</span></button><button data-n="雞胸沙拉" data-c="300" data-p="30">🥗 雞胸沙拉<br><span class="muted">300 kcal</span></button></div><div class="progress">快捷熱量為估算值，實際以包裝或店家營養標示為準。</div></section>
<section class="panel"><div class="row" style="justify-content:space-between"><strong>當日紀錄</strong><button class="smallbtn" id="clearDay" type="button">清除這天</button></div><div id="list"></div></section>
<section class="panel"><strong>體重／腰圍</strong><div class="two" style="margin-top:10px"><input id="weight" type="number" step="0.1" placeholder="體重 kg"><input id="waist" type="number" step="0.1" placeholder="腰圍 cm"></div><button class="primary" id="saveBody" type="button" style="width:100%;margin-top:8px">儲存當日身體紀錄</button><div id="bodyHistory" class="progress"></div></section>
<section class="panel"><strong>固定運動</strong><div class="progress">週二 🚴 飛輪　｜　週三 🧗 抱石　｜　週五 🧗 抱石</div><div class="progress">資料儲存在此裝置瀏覽器中；清除網站資料時紀錄可能被刪除。</div></section></main>
<script>const KEY="cut70-pwa-v1";let db;try{db=JSON.parse(localStorage.getItem(KEY))||{foods:{},body:{}}}catch(e){db={foods:{},body:{}}}const $=id=>document.getElementById(id),date=$("date");function localDate(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}date.value=localDate();function save(){localStorage.setItem(KEY,JSON.stringify(db))}function day(){let k=date.value;if(!db.foods[k])db.foods[k]=[];return db.foods[k]}function render(){let a=day(),used=a.reduce((s,x)=>s+x.c,0),pro=a.reduce((s,x)=>s+x.p,0),rem=2000-used;$("used").textContent=used;$("remain").textContent=rem>=0?rem:"+"+Math.abs(rem);$("protein").textContent=pro;$("bar").style.width=Math.min(100,used/20)+"%";let list=$("list");list.innerHTML=a.length?"":'<div class="progress">這一天還沒有飲食紀錄。</div>';a.forEach((x,i)=>{let el=document.createElement("div");el.className="food";let l=document.createElement("div"),r=document.createElement("div");l.innerHTML="<strong></strong><div class=muted></div>";l.children[0].textContent=x.n;l.children[1].textContent=x.meal+" · "+x.p+" g 蛋白質";r.className="row";let t=document.createElement("span"),b=document.createElement("button");t.textContent=x.c+" kcal";b.type="button";b.className="smallbtn";b.textContent="刪";b.onclick=()=>{a.splice(i,1);save();render()};r.append(t,b);el.append(l,r);list.append(el)});let body=db.body[date.value];$("weight").value=body?.weight||"";$("waist").value=body?.waist||"";let ws=Object.entries(db.body).filter(([k,v])=>v.weight).sort((a,b)=>a[0].localeCompare(b[0]));if(ws.length){let last=ws.at(-1)[1].weight;$("currentWeight").textContent=Number(last).toFixed(1)+" kg";$("bodyHistory").textContent="已累積 "+ws.length+" 天體重紀錄；最近一次 "+Number(last).toFixed(1)+" kg。"}else $("bodyHistory").textContent="尚未建立體重紀錄。"}$("foodForm").addEventListener("submit",e=>{e.preventDefault();let n=$("food").value.trim(),c=Number($("cal").value),p=Number($("pro").value||0);if(!n||!Number.isFinite(c)||!Number.isFinite(p))return;day().push({n,c:Math.round(c),p:Math.round(p),meal:$("meal").value});save();$("foodForm").reset();render()});document.querySelectorAll("#quick button").forEach(b=>b.onclick=()=>{day().push({n:b.dataset.n,c:+b.dataset.c,p:+b.dataset.p,meal:$("meal").value});save();render()});date.onchange=render;$("clearDay").onclick=()=>{if(confirm("確定清除 "+date.value+" 的飲食紀錄？")){db.foods[date.value]=[];save();render()}};$("saveBody").onclick=()=>{let w=Number($("weight").value),wa=Number($("waist").value);if(!w&&!wa){alert("請輸入體重或腰圍");return}db.body[date.value]={weight:w||null,waist:wa||null};save();render()};if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});render();</script></body></html>
